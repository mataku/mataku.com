<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Club Kids Never Die</title>
    <link rel="stylesheet" href="/assets/{{css_file}}">
    <link rel="icon" href="/assets/favicon.ico">
    <meta name="theme-color" content="transparent">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <script src="/assets/{{theme_js_file}}"></script>
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="https://mataku.com/assets/icon.png">
    <meta property="og:site_name" content="Club Kids Never Die">
    <link rel="alternate" type="application/atom+xml" title="Club Kids Never Die" href="https://mataku.com/feed.xml">
</head>

<body>
    <div class="container">
        <header class="index-header">
            <a href="/">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                <span>Home</span>
            </a>
            {{header_actions}}
        </header>
        <div class="article-card-wrapper">
            <div class="article-header">
                <h1>{{title}}</h1>
                <time datetime="{{date_iso}}">{{date}}</time>
                <div class="tags">{{tags}}</div>
            </div>
            <main>
                <article>
                    {{content}}
                </article>
            </main>
        </div>
        {{footer}}
    </div>
    <script src="/assets/prism-core.min.js" defer></script>
    <script src="/assets/prism-autoloader.min.js" data-autoloader-path="/assets/" defer></script>
    {{x_widgets_script}}
</body>

</html>
