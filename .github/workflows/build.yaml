name: Build

on:
  pull_request:

concurrency:
  group: build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRADLE_OPTS: -Dorg.gradle.configuration-cache=false -Dorg.gradle.jvmargs=-Xmx1g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1

      - name: Run generator tests
        run: ./gradlew :generator:test

      - name: Run worker tests
        run: ./gradlew :worker:wasmJsTest

  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    env:
      GRADLE_OPTS: -Dorg.gradle.configuration-cache=false -Dorg.gradle.jvmargs=-Xmx1g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Generate articles
        run: make generate

      - name: Build Worker
        run: make build-worker

      - name: Upload Worker Version
        if: ${{ !startsWith(github.head_ref, 'renovate/') }}
        id: deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias=feature-branch

      - name: Comment deployment URL on PR
        if: ${{ !startsWith(github.head_ref, 'renovate/') }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: preview-deploy
          message: |
            Preview deployment: ${{ steps.deploy.outputs.deployment-url }}
