<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} — Club Kids Never Die</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="container">
        <header class="site-header">
            <a href="/">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                <span>Club Kids Never Die</span>
            </a>
        </header>
        <div class="article-card-wrapper">
            <header class="article-header">
                <h1>{{title}}</h1>
                <time datetime="{{date}}">{{date}}</time>
                <div class="tags">{{tags}}</div>
            </header>
            <main>
                <article>
                    {{content}}
                </article>
            </main>
        </div>
        <footer>
            &copy; mataku
        </footer>
    </div>
</body>

</html>
